

services:
  mongodb:
    image: mongo:6
    container_name: alarm-mongodb-prod
    restart: always
    environment:
      MONGO_INITDB_DATABASE: alarmapp
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - alarm-network

  backend:
    build: ./backend
    container_name: alarm-backend-prod
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/alarmapp
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - alarm-network

  frontend:
    build: ./frontend
    container_name: alarm-frontend-prod
    restart: always
    environment:
      - REACT_APP_API_URL=/api
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - alarm-network
  prometheus:
    image: prom/prometheus:latest
    container_name: alarm-prometheus-prod
    restart: always
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command: 
    - '--config.file=/etc/prometheus/prometheus.yml'
    - '--storage.tsdb.path=/prometheus'
    - '--storage.tsdb.retention.time=30d'
    ports:
      - "9090:9090"
    networks:
      - alarm-network

  grafana:
    image: grafana/grafana:latest
    container_name: alarm-grafana-prod
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=Securepassword123!
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SERVER_ROOT_URL=http://${SERVER_IP}:3001
      - GF_INSTALL_PLUGINS=
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - alarm-network

volumes:
  mongo_data:
     driver: local
  prometheus_data:
     driver: local    
  grafana_data:
     driver: local

networks:
  alarm-network:
    driver: bridge
